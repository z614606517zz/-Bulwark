<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磐垒防御系统 - 下载</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }
        
        .logo p {
            color: #666;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .info {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 6px;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .info strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🛡️ 磐垒防御系统</h1>
            <p>Bulwark Host-based Intrusion Prevention System</p>
        </div>
        
        <form id="downloadForm">
            <div class="form-group">
                <label for="password">请输入下载密码：</label>
                <input type="password" id="password" placeholder="输入密码以下载安装包" required>
            </div>
            
            <button type="submit" class="btn">验证并下载</button>
            
            <div id="error" class="error">密码错误，请重试</div>
        </form>
        
        <div class="info">
            <strong>📦 包含内容：</strong><br>
            • bulwark_service.exe - 主服务程序<br>
            • bulwark_ui.exe - 用户界面<br>
            • appsettings.json - 配置文件<br>
            • 所需 Qt 运行库及插件
        </div>
    </div>
    
    <script>
        const CORRECT_PASSWORD = '123';
        const DOWNLOAD_FILE = 'Bulwark-Release.zip';
        
        document.getElementById('downloadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            if (password === CORRECT_PASSWORD) {
                errorDiv.classList.remove('show');
                // 触发下载
                window.location.href = DOWNLOAD_FILE;
                // 清空输入框
                document.getElementById('password').value = '';
            } else {
                errorDiv.classList.add('show');
                // 3秒后隐藏错误信息
                setTimeout(() => {
                    errorDiv.classList.remove('show');
                }, 3000);
            }
        });
        
        // 回车键提交
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('downloadForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
