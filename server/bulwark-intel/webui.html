<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bulwark 威胁分析</title>
<style>
  :root{
    --bg:#eef1f7; --card:#ffffff; --soft:#f6f8fc; --line:#e4e8f0; --line2:#eef1f6;
    --ink:#1b2230; --ink2:#3b475c; --muted:#6b7688; --dim:#98a2b3;
    --brand:#6366f1; --brand2:#8b5cf6;
    --mal:#e5484d; --malbg:#fdecec; --susp:#e08600; --suspbg:#fdf3e2;
    --clean:#0f9d58; --cleanbg:#e7f6ec; --unk:#8a94a6; --unkbg:#eef1f6;
    --mono:"SFMono-Regular","Cascadia Mono","Consolas",Menlo,monospace;
    --sans:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",system-ui,sans-serif;
    --sh:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
    --sh2:0 12px 40px rgba(16,24,40,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:14.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--brand);text-decoration:none}
  ::selection{background:rgba(99,102,241,.18)}
  /* ── 顶栏:两层 ──────────────────────────────────────────────
     第一层 = 品牌 + 今日额度 + 反馈;第二层 = 导航。
     之前八个元素挤在同一个 flex 行里,总宽超过 1080 容器,flex 就去压缩
     每一项,把「银狐情报」断成了「银狐情 / 报」。所以导航项一律
     flex:0 0 auto + white-space:nowrap(永不压缩、永不断行),放不下时
     由第二层自己横向滚动,而不是挤压文字。 */
  .top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:11px 20px}
  .brand{flex:0 0 auto;display:flex;align-items:center;gap:10px;font-weight:750;font-size:16px;white-space:nowrap}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));
    display:grid;place-items:center;color:#fff;font-size:16px;box-shadow:0 6px 16px rgba(99,102,241,.35)}
  .grow{flex:1;min-width:8px}
  /* 圆角胶囊 = 只读状态,跟下面可点的圆角矩形在形状上区分开 */
  .metrics{flex:0 0 auto;white-space:nowrap;color:var(--muted);font-size:12.5px;
    background:var(--soft);border:1px solid var(--line2);border-radius:999px;padding:5px 12px}
  /* JS 填之前它是空的,不藏起来就先闪一个空胶囊 */
  .metrics:empty{display:none}
  .metrics b{color:var(--ink);font-weight:700}
  .iconbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:10px;
    padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;
    transition:border-color .15s,color .15s}
  .iconbtn:hover{border-color:var(--brand);color:var(--brand)}
  /* 未处理反馈用红点徽标,跟导航里的灰色计数区分:这个是待办,不是统计。
     inline-block 是必须的 —— <b> 默认 inline,min-width 对 inline 元素无效。
     但作者样式里的 display 会盖掉 [hidden] 的 display:none,所以要补一条
     [hidden] 规则,否则 0 条未处理时徽标也一直挂着。 */
  .iconbtn b{display:inline-block;font-weight:700;font-size:11.5px;color:#fff;background:var(--mal);
    border-radius:999px;padding:1px 6px;min-width:18px;text-align:center;line-height:1.5}
  .iconbtn b[hidden]{display:none}
  .nav{border-top:1px solid var(--line2)}
  .navin{max-width:1080px;margin:0 auto;padding:8px 20px 9px;display:flex;align-items:center;gap:8px;
    overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .navin::-webkit-scrollbar{display:none}
  .navi{flex:0 0 auto;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:10px;
    padding:7px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;
    transition:border-color .15s,color .15s,box-shadow .15s}
  .navi:hover{border-color:var(--brand);color:var(--brand);box-shadow:0 2px 8px rgba(99,102,241,.12)}
  .navi .i{font-size:14px;line-height:1}
  .navi b{display:inline-block;font-weight:700;font-size:12px;color:var(--muted);background:var(--soft);
    border-radius:6px;padding:1px 6px;min-width:20px;text-align:center}
  .navi:hover b{background:rgba(99,102,241,.10);color:var(--brand)}
  @media(max-width:700px){
    .metrics{display:none}
    .iconbtn .lbl{display:none}
    .brand{font-size:15px}
  }
  .wrap{max-width:1080px;margin:0 auto;padding:26px 20px 60px}
  /* hero scan card */
  .hero{background:linear-gradient(180deg,#fff, #fbfcfe);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:26px;margin-bottom:20px}
  .hero h1{margin:0 0 6px;font-size:22px;letter-spacing:-.3px}
  .hero .lead{margin:0 0 18px;color:var(--muted);font-size:13.5px}
  .scan{display:flex;gap:10px}
  .scan .field{flex:1;position:relative}
  .scan input{width:100%;padding:14px 15px;border:1.5px solid var(--line);border-radius:12px;font:inherit;font-family:var(--mono);font-size:14px;background:var(--soft);transition:.15s}
  .scan input:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.14)}
  .btn{border:none;border-radius:12px;padding:0 22px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));cursor:pointer;transition:.12s;white-space:nowrap}
  .btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:default;filter:none}
  .or{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:12px;margin:16px 0}
  .or::before,.or::after{content:"";height:1px;background:var(--line);flex:1}
  .drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    border:1.5px dashed #cdd4e2;border-radius:14px;padding:26px 20px;text-align:center;cursor:pointer;transition:.15s;background:var(--soft)}
  .drop:hover,.drop.drag{border-color:var(--brand);background:#f3f2ff}
  .drop .ic{font-size:30px;line-height:1}.drop b{font-weight:650}.drop small{color:var(--dim);font-size:12px;max-width:560px;line-height:1.5}
  #fileinput{display:none}
  .status{min-height:22px;margin:0 0 18px;font-size:13.5px;color:var(--muted);display:flex;gap:9px;align-items:center}
  .status.err{color:var(--mal)}.status.ok{color:var(--clean)}
  .spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
  .placeholder{padding:70px 20px;text-align:center;color:var(--dim)}.placeholder .big{font-size:44px;opacity:.4}
  /* verdict banner */
  .vbanner{border-radius:16px 16px 0 0;padding:22px 24px;display:flex;gap:22px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .v-malicious .vbanner{background:linear-gradient(180deg,var(--malbg),#fff)} .v-suspicious .vbanner{background:linear-gradient(180deg,var(--suspbg),#fff)}
  .v-clean .vbanner{background:linear-gradient(180deg,var(--cleanbg),#fff)} .v-unknown .vbanner{background:linear-gradient(180deg,var(--unkbg),#fff)}
  .ring{--pct:0;--c:var(--unk);width:96px;height:96px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--pct)*1%), #e7ebf2 0)}
  .ring::after{content:"";position:absolute;width:74px;height:74px;border-radius:50%;background:#fff}
  .ring{position:relative}.ring .n{position:relative;text-align:center;line-height:1.05}.ring .n b{font-size:24px;font-weight:800}.ring .n small{display:block;color:var(--muted);font-size:11px}
  .v-malicious .ring{--c:var(--mal)}.v-suspicious .ring{--c:var(--susp)}.v-clean .ring{--c:var(--clean)}.v-unknown .ring{--c:var(--unk)}
  .vmain{flex:1;min-width:250px}
  .chip{display:inline-block;padding:4px 13px;border-radius:20px;font-weight:800;font-size:12.5px}
  .v-malicious .chip{background:var(--mal);color:#fff}.v-suspicious .chip{background:var(--susp);color:#fff}.v-clean .chip{background:var(--clean);color:#fff}.v-unknown .chip{background:var(--unk);color:#fff}
  .vlabel{margin-left:10px;font-weight:600;color:var(--ink2)}
  .vname{font-size:17px;font-weight:700;margin:9px 0 3px;word-break:break-all}
  .vmeta{color:var(--muted);font-size:12.5px}
  .hashes{margin-top:11px;display:flex;flex-direction:column;gap:3px}
  .hrow{font-family:var(--mono);font-size:12px;color:var(--muted);cursor:pointer;word-break:break-all}
  .hrow:hover{color:var(--ink)}.hrow span{color:var(--dim);width:56px;display:inline-block}
  .vside{font-size:12.5px;color:var(--muted);text-align:right;min-width:150px}.vside .k{color:var(--dim)}
  /* segmented control */
  .seg{display:flex;gap:6px;padding:14px 20px 0;flex-wrap:wrap}
  .seg .s{padding:8px 16px;border-radius:10px;background:var(--soft);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;transition:.12s}
  .seg .s:hover{color:var(--ink)}.seg .s.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .seg .s .c{opacity:.7;font-weight:500;margin-left:5px}
  .pane{display:none;padding:18px 20px 22px}.pane.on{display:block}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
  th{color:var(--dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  tbody tr:hover td{background:var(--soft)}
  .mono{font-family:var(--mono)}
  .kv{display:grid;grid-template-columns:170px 1fr;gap:8px 16px;font-size:13px}.kv .k{color:var(--muted)}.kv .v{word-break:break-all;font-family:var(--mono);font-size:12px}
  .pill{font-size:11.5px;padding:3px 10px;border-radius:20px;background:var(--soft);border:1px solid var(--line);color:var(--ink2);margin:0 6px 7px 0;display:inline-block}
  .pill.mal{background:var(--malbg);color:var(--mal);border-color:transparent}.pill.susp{background:var(--suspbg);color:var(--susp);border-color:transparent}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .bx{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .bx h4{margin:0;padding:10px 13px;font-size:12.5px;background:var(--soft);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .bx h4 .n{color:var(--dim);font-weight:500}
  .bx ul{margin:0;padding:0;list-style:none;font-family:var(--mono);font-size:11.5px;max-height:260px;overflow:auto}
  .bx li{padding:5px 13px;border-bottom:1px solid var(--line2);color:var(--ink2);word-break:break-all}
  .empty{color:var(--dim);font-size:13px;padding:10px 2px}
  .fbtns{display:flex;gap:7px;margin-bottom:12px}
  .fbtn{font-size:12.5px;padding:5px 12px;border-radius:8px;background:var(--soft);border:1px solid var(--line);color:var(--muted);cursor:pointer}
  .fbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
  /* feedback modal fields */
  .fblab{display:block;font-size:13px;font-weight:650;margin-bottom:6px;color:var(--ink2)}
  .fbinput{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
    background:var(--soft);color:var(--ink);font:14px/1.55 var(--sans);outline:none}
  .fbinput:focus{border-color:var(--brand);background:var(--card)}
  textarea.fbinput{resize:vertical;min-height:110px}
  /* history modal — threat archive */
  .hmodal{position:fixed;inset:0;background:rgba(16,24,40,.42);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility .2s;z-index:40;
    display:flex;align-items:flex-start;justify-content:center;padding:40px 20px}
  .hmodal.open{opacity:1;visibility:visible;pointer-events:auto;backdrop-filter:blur(3px)}
  .hpanel{background:var(--bg);width:100%;max-width:1080px;max-height:calc(100vh - 80px);border-radius:18px;box-shadow:var(--sh2);
    display:flex;flex-direction:column;overflow:hidden;transform:translateY(14px);transition:transform .24s cubic-bezier(.4,0,.2,1)}
  .hmodal.open .hpanel{transform:none}
  .hhead{display:flex;align-items:center;justify-content:space-between;padding:17px 22px;background:var(--card);border-bottom:1px solid var(--line)}
  .htitle{font-size:17px;font-weight:750;display:flex;align-items:center;gap:9px}
  .htitle .hsub{font-size:12.5px;color:var(--muted);font-weight:500}
  .hhead .x{border:none;background:var(--soft);border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:16px;color:var(--muted)}
  .hhead .x:hover{background:var(--line);color:var(--ink)}
  .hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px 22px 4px}
  .hstat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 15px}
  .hstat .v{font-size:23px;font-weight:800;line-height:1.1}
  .hstat .k{font-size:12px;color:var(--muted);margin-top:3px}
  .hstat.mal .v{color:var(--mal)}.hstat.susp .v{color:var(--susp)}
  .hbar{display:flex;align-items:center;gap:10px;padding:14px 22px 10px;flex-wrap:wrap}
  .hfilters{display:flex;gap:7px}
  .hchip{padding:7px 14px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;transition:.12s}
  .hchip:hover{color:var(--ink)}
  .hchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .hchip b{font-weight:800;margin-left:4px}
  .hspace{flex:1}
  .hsort{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);font:inherit;font-size:13px;color:var(--ink2);cursor:pointer}
  .hsearch{padding:8px 13px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;background:var(--card);width:230px;max-width:46vw}
  .hsearch:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
  .hlist{overflow:auto;padding:4px 22px 22px;display:flex;flex-direction:column;gap:9px}
  .hcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:12px 15px;cursor:pointer;transition:.12s;flex:none}
  .hcard:hover{box-shadow:var(--sh);transform:translateY(-1px)}
  .hcard.malicious{border-left-color:var(--mal)}.hcard.suspicious{border-left-color:var(--susp)}
  .hcard .hv{flex:none;width:56px;text-align:center}
  .hcard .hv .chip{display:inline-block;padding:3px 10px;border-radius:20px;font-weight:800;font-size:11.5px;color:#fff}
  .hcard.malicious .hv .chip{background:var(--mal)}.hcard.suspicious .hv .chip{background:var(--susp)}
  .hcard .hmain{flex:1;min-width:0}
  .hcard .hnm{font-weight:650;font-size:14px;word-break:break-all;line-height:1.3}
  .hcard .hfam{margin-top:4px}
  .hcard .hmeta{margin-top:4px;font-size:11.5px;color:var(--dim);font-family:var(--mono);word-break:break-all}
  .hcard .hdet{flex:none;width:160px;text-align:right}
  .hcard .hratio{font-size:15px;font-weight:800}
  .hcard.malicious .hratio{color:var(--mal)}.hcard.suspicious .hratio{color:var(--susp)}
  .hcard .hratio small{color:var(--dim);font-weight:600;font-size:11px}
  .hcard .hbarwrap{height:5px;background:var(--soft);border-radius:3px;margin-top:6px;overflow:hidden}
  .hcard .hbarfill{height:100%;border-radius:3px}
  .hcard.malicious .hbarfill{background:var(--mal)}.hcard.suspicious .hbarfill{background:var(--susp)}
  .hcard .hdate{font-size:11px;color:var(--dim);margin-top:6px}
  @media(max-width:640px){.hstats{grid-template-columns:repeat(2,1fr)}.hcard .hdet{display:none}.hsearch{width:140px}}
  /* landing dashboard (idle state) */
  .dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .dgrid{display:grid;grid-template-columns:1fr 322px;gap:16px;align-items:start}
  .dsec{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:16px 18px;margin-bottom:16px}
  .dsec:last-child{margin-bottom:0}
  .dsec-h{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:13px}
  .dsec-h .ic{margin-right:7px}
  .dmore{font-size:12.5px;color:var(--brand);cursor:pointer;font-weight:600}
  .dmore:hover{text-decoration:underline}
  .drecent{display:flex;flex-direction:column;gap:9px}
  .dempty{color:var(--dim);font-size:13px;padding:26px 0;text-align:center}
  .dsrc-i{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
  .dsrc-i:last-child{border-bottom:none}
  .dsrc-i .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dsrc-i .dot.on{background:var(--clean);box-shadow:0 0 0 3px rgba(15,157,88,.15)}
  .dsrc-i .dot.off{background:var(--dim)}
  .dsrc-i .nm{flex:1;font-weight:600}
  .dsrc-i .ks{font-size:11.5px;color:var(--muted)}
  .dfam{display:flex;flex-direction:column;gap:2px}
  .dfam-i{display:flex;align-items:center;justify-content:space-between;padding:5px 0;cursor:pointer;border-radius:8px}
  .dfam-i:hover{background:var(--soft)}
  .dfam-i b{font-weight:800;color:var(--muted);font-size:12.5px;padding-right:2px}
  @media(max-width:820px){.dstats{grid-template-columns:repeat(2,1fr)}.dgrid{grid-template-columns:1fr}}
  /* 银狐情报 page */
  .sfhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sftitle{font-size:19px;font-weight:750;display:flex;align-items:center;gap:10px}
  .sftitle .hsub{font-size:12.5px;color:var(--muted);font-weight:500}
  .sfbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
  .sflist{display:flex;flex-direction:column;gap:9px}
  /* behaviour report — domain grouped */
  .beh-sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .beh-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--soft);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2)}
  .beh-chip .i{font-size:13px}
  .beh-chip b{font-weight:800;color:var(--ink);margin-left:2px}
  .beh-chip.proc{background:#f2f0ff;border-color:#e6e1ff}
  .beh-chip.file{background:#eefaf1;border-color:#d6f0dd}
  .beh-chip.reg{background:#fff7e8;border-color:#fbe8c4}
  .beh-chip.net{background:#eef4ff;border-color:#d9e6ff}
  .beh-chip.sys{background:#f3f5f8;border-color:#e3e8f0}
  .beh-chip.mitre{background:var(--malbg);border-color:transparent;color:var(--mal)}.beh-chip.mitre b{color:var(--mal)}
  .beh-tags{margin-bottom:14px;line-height:2}
  .beh-sec{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
  .beh-h{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;background:var(--soft);border-bottom:1px solid var(--line)}
  .beh-h .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
  .beh-h .i{font-size:15px}
  .beh-h .cbadge{font-size:12px;font-weight:800;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:2px 11px}
  .beh-sec.proc .beh-h{background:#f4f2ff}.beh-sec.file .beh-h{background:#eefaf1}.beh-sec.reg .beh-h{background:#fff7e8}.beh-sec.net .beh-h{background:#eef4ff}
  .beh-sec.proc{border-left:3px solid var(--brand2)}.beh-sec.file{border-left:3px solid var(--clean)}.beh-sec.reg{border-left:3px solid var(--susp)}.beh-sec.net{border-left:3px solid var(--brand)}.beh-sec.sys{border-left:3px solid var(--unk)}
  .beh-body{padding:4px 15px 13px}
  .beh-cat{margin-top:11px}

  .mitre-row:last-child{border-bottom:none}
  .mitre-row .mid{font-family:var(--mono);font-size:12px;color:var(--brand);font-weight:700;flex:none;width:76px}
  .mitre-row .mdesc{flex:1;font-size:12.5px;color:var(--ink2)}
  .mitre-row .pill{flex:none}
  /* behaviour graph (图谱) — node-link tree */
  /* horizontal (left-to-right) tree: root on the left, each level flows right */
  .g-tree{overflow:auto;max-height:72vh;padding:14px 8px;cursor:grab}
  .g-tree.panning{cursor:grabbing}
  .g-tree.panning *{cursor:grabbing!important}
  .g-canvas{width:max-content;transform-origin:0 0}
  .g-tree ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;flex:0 0 auto}
  .g-tree li{position:relative;display:flex;align-items:center;padding:5px 0;flex:0 0 auto}
  .g-tree li>ul{margin-left:36px;position:relative;flex:0 0 auto}
  /* connector from a parent node into its children's vertical spine */
  .g-tree li>ul::before{content:"";position:absolute;top:50%;left:-36px;width:18px;height:2px;background:var(--line)}
  /* per-child horizontal stub from the spine to the child node */
  .g-tree li>ul>li::before{content:"";position:absolute;left:-18px;top:50%;width:18px;height:2px;background:var(--line)}
  /* vertical spine linking siblings */
  .g-tree li>ul>li::after{content:"";position:absolute;left:-18px;top:0;bottom:0;width:2px;background:var(--line)}
  .g-tree li>ul>li:first-child::after{top:50%}
  .g-tree li>ul>li:last-child::after{bottom:50%}
  .g-tree li>ul>li:only-child::after{display:none}
  .g-node{display:inline-flex;flex:0 0 auto;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;box-shadow:var(--sh);width:max-content;max-width:420px;vertical-align:top;cursor:default}
  .g-node .g-ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;font-size:13px;background:var(--soft)}
  .g-node .g-tx{min-width:0}
  .g-node .g-t{font-weight:650;font-size:13px;word-break:break-all;line-height:1.25}
  .g-node .g-s{font-size:11px;color:var(--muted);font-family:var(--mono);word-break:break-all;margin-top:1px}
  .g-node.root{border-color:var(--brand);box-shadow:0 4px 14px rgba(99,102,241,.16)}
  .g-node.root .g-ic,.g-node.proc .g-ic,.g-node.net .g-ic{background:rgba(99,102,241,.14)}
  .g-node.hub{background:linear-gradient(135deg,#f59e0b,#f97316);border-color:transparent}
  .g-node.hub .g-t{color:#fff}.g-node.hub .g-s{color:rgba(255,255,255,.9)}.g-node.hub .g-ic{background:rgba(255,255,255,.25)}
  .g-node.file .g-ic{background:var(--cleanbg)}
  .g-node.reg .g-ic{background:var(--suspbg)}
  .g-node.sys .g-ic{background:var(--unkbg)}
  .g-node.cat{font-weight:700}
  .g-node.leaf{padding:5px 11px;box-shadow:none;background:var(--soft)}
  .g-node.leaf .g-ic{width:20px;height:20px;font-size:11px}
  .g-node.leaf .g-t{font-weight:500;font-size:12px}
  .g-node.more{border-style:dashed;background:transparent;box-shadow:none;color:var(--muted)}
  .g-node.more .g-ic{background:transparent}
  .g-tools{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;position:sticky;left:0}
  .g-btn{font-size:12px;padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink2);cursor:pointer;font-weight:600}
  .g-btn:hover{border-color:var(--brand);color:var(--brand)}
  .g-zoom{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
  .g-zoom .g-btn{padding:5px 10px;min-width:30px}
  .g-zlabel{font-size:12px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
  .g-hint{font-size:11px;color:var(--dim);margin-top:7px}
  .g-caret{font-size:9px;color:var(--dim);transition:transform .15s;display:inline-block;width:9px}
  .g-node.hub .g-caret{color:rgba(255,255,255,.85)}
  .g-collapsible{cursor:pointer}
  .g-tree li.collapsed>.g-node .g-caret{transform:rotate(-90deg)}
  .g-tree li.collapsed>ul{display:none}
  .ipq{color:var(--brand);cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
  .ipq:hover{color:var(--brand2)}
  .ipq-load{opacity:.5}
  .ipv{font-size:10.5px;font-weight:700;padding:0 7px;border-radius:20px;background:var(--unkbg);color:var(--unk)}
  .ipv.mal{background:var(--mal);color:#fff}.ipv.susp{background:var(--susp);color:#fff}.ipv.clean{background:var(--clean);color:#fff}
  /* multi-source consensus strip */
  .srcstrip{padding:14px 20px 0}
  .srcstrip-h{font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:9px}
  .srcstrip-h span{color:var(--muted)}
  .srcstrip-b{display:flex;flex-wrap:wrap;gap:8px}
  .src-item{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px}
  .src-nm{font-weight:700}
  .src-v{font-weight:800;font-size:11px;padding:1px 8px;border-radius:20px;background:var(--unkbg);color:var(--unk)}
  .src-v.mal{background:var(--mal);color:#fff}.src-v.susp{background:var(--susp);color:#fff}.src-v.clean{background:var(--clean);color:#fff}
  .src-x{color:var(--muted);font-size:11px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;z-index:60;box-shadow:var(--sh2)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:560px){.scan{flex-direction:column}.btn{padding:13px}}
</style>
</head>
<body>
<div class="top">

    <button class="iconbtn" id="fbbtn" title="提交问题反馈">
      <!-- id 用 fbnew 而不是 fbcount:后者已被弹窗里的字数计数器占用,
           同名会让 $("#fbcount") 命中这里,把字数计数器和徽标同时搞坏 -->

<!-- 问题反馈。提交口 POST /feedback 是公开的(普通用户没有 token),
     所以服务端配了 per-IP 限流 + 每日条数上限 + 字段长度上限。 -->
<div class="hmodal" id="fbmodal"><div class="hpanel" style="max-width:580px">
  <div class="hhead">

  </div>

      <div class="fbtab" data-t="mine" style="padding:8px 14px;cursor:pointer;font-weight:600;

        placeholder="请尽量写清楚:什么操作触发的、涉及哪个程序、出现了什么现象。&#10;误报/漏报请附上文件名或哈希,便于核查。"></textarea>

      提交内容会连同你的 IP 前两段与浏览器类型一并记录,仅用于排查问题。请勿填写密码等敏感信息。
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="btn" id="fbsend" style="padding:10px 20px">提交</button>
      <span id="fbstatus" style="font-size:13px"></span>

</div></div>

<div class="wrap">

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const VMAP={malicious:"恶意",suspicious:"可疑",clean:"安全",unknown:"未知"};
const CATMAP={trojan:"木马",ransomware:"勒索软件",worm:"蠕虫",backdoor:"后门",virus:"病毒",adware:"广告软件",pua:"潜在有害",grayware:"灰色软件",downloader:"下载器",dropper:"释放器",spyware:"间谍软件",banker:"银行木马",coinminer:"挖矿木马",miner:"挖矿木马",rootkit:"Rootkit",exploit:"漏洞利用",keylogger:"键盘记录",rat:"远控木马",stealer:"窃密木马",botnet:"僵尸网络",phishing:"钓鱼",installer:"捆绑安装",packed:"加壳",virtool:"病毒工具",hacktool:"黑客工具"};
const catName=c=>CATMAP[c]||c||"未分类";
let allReports=[];
let MAXUP=650;  // max upload MB; refreshed from /stats
let hFilter="all",hSort="recent";  // threat-archive view state
let sfFilter="all";                // 银狐 sub-family filter
let statsData=null;let archStats=null,sfReports=[];  /* whole-DB counters + full SilverFox list */               // last /stats payload
let benignReports=[],benignStats=null,bnFilter="all";  // 正常样本区:清单 + 概况 + 子筛选
let viewMode="dashboard";         // dashboard | report | silverfox | normal

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2400);}
function setStatus(m,k){const el=$("#status");if(!m){el.innerHTML="";el.className="status";return;}
  el.innerHTML=(k==="busy"?'<span class="spin"></span>':"")+"<span>"+esc(m)+"</span>";el.className="status"+(k==="err"?" err":k==="ok"?" ok":"");}
function fmtDate(ep){if(!ep)return"—";try{return new Date(ep*1000).toISOString().replace("T"," ").slice(0,19)+" UTC";}catch(e){return String(ep);}}
function fmtSize(n){if(n==null||n==="")return"—";const u=["B","KB","MB","GB"];let i=0,v=Number(n);while(v>=1024&&i<u.length-1){v/=1024;i++;}return(i?v.toFixed(1):v)+" "+u[i];}
function verdictOf(f){const s=f.last_analysis_stats||{};const m=s.malicious||0,su=s.suspicious||0;return m>=5?"malicious":(m>0||su>0?"suspicious":(Object.keys(s).length?"clean":"unknown"));}
async function jget(p){const r=await fetch(p);return r.json();}
async function jpost(p,o){const r=await fetch(p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});return r.json();}

// history modal — threat archive
function openHistory(v){$("#hmodal").classList.toggle("open",v);if(v)drawReports();}
$("#histbtn").onclick=()=>openHistory(!$("#hmodal").classList.contains("open"));
$("#sfbtn").onclick=()=>renderSilverfox();
$("#normalbtn").onclick=()=>{renderNormal();loadBenign();};
$("#hclose").onclick=()=>openHistory(false);
$("#hmodal").addEventListener("click",e=>{if(e.target===$("#hmodal"))openHistory(false);});
$("#hsort").addEventListener("change",e=>{hSort=e.target.value;drawReports();});
document.querySelectorAll("#hfilters .hchip").forEach(c=>c.onclick=()=>{hFilter=c.dataset.f;drawReports();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")openHistory(false);});

// ---- 问题反馈 ----
function openFeedback(v){
  $("#fbmodal").classList.toggle("open",v);
  if(v){$("#fbstatus").textContent="";fbSwitch("new");$("#fbmsg").focus();loadMine();}
}
// ---- 我的反馈 ----
// 服务端按调用方 IP 认领,不需要账号。返回里没有 contact/ip/agent —— IP 会被
// NAT 共享,同一出口下的另一个人不该看到别人留的联系方式。
const FBST={new:["待处理","var(--warn,#d97706)"],done:["已处理","var(--clean)"]};
function fbSwitch(t){
  document.querySelectorAll(".fbtab").forEach(el=>{
    const on=el.dataset.t===t;
    el.style.borderBottomColor=on?"var(--brand)":"transparent";
    el.style.color=on?"var(--brand)":"var(--muted)";
  });
  $("#fbform").hidden=(t!=="new");
  $("#fbmine").hidden=(t!=="mine");
}
document.querySelectorAll(".fbtab").forEach(el=>el.onclick=()=>{
  fbSwitch(el.dataset.t); if(el.dataset.t==="mine")loadMine();});
async function loadMine(){
  const box=$("#fbmine");
  try{
    const d=await jget("/feedback/mine");
    const items=d.items||[];
    const nNew=items.filter(x=>x.status!=="done").length;
    const mc=$("#fbmc");
    if(mc)mc.textContent=items.length?("("+items.length+")"):"";
    if(!items.length){
      box.innerHTML='<div style="padding:40px 0;text-align:center;color:var(--dim);font-size:13px">'
        +'还没有提交过反馈。<br><span style="font-size:12px">按来源 IP 识别('+esc(d.ip||"")+'),'
        +'换网络或换设备会看不到之前的记录。</span></div>';
      return;
    }
    box.innerHTML='<div style="font-size:12.5px;color:var(--dim);margin-bottom:10px">'
      +'共 '+items.length+' 条,'+nNew+' 条待处理 · 按来源 IP 识别('+esc(d.ip||"")+')</div>'
      +items.map(x=>{
      const s=FBST[x.status]||["未知","var(--muted)"];
      return `<div style="border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--soft)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <span style="font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;
            background:${s[1]};color:#fff">${s[0]}</span>
          <span style="font-family:var(--mono);font-size:12px;color:var(--muted)">#${x.id}</span>
          <span style="font-size:12px;color:var(--dim);margin-left:auto">${esc((x.at||"").replace("T"," ").slice(0,16))}</span>
        </div>
        <div style="font-size:13.5px;white-space:pre-wrap;word-break:break-word">${esc(x.message||"")||'<span style="color:var(--dim)">(只有截图)</span>'}</div>
        ${x.image_count?`<div style="font-size:12px;color:var(--dim);margin-top:5px">附 ${x.image_count} 张截图</div>`:""}

// ---- 反馈截图 ----
// 走 JSON 里的 base64:提交口本来就是 JSON,不为了带图另开一条 multipart 通道 ——
// 那等于在公开无鉴权的口子上多写一个解析器。
// 这里的类型/大小检查只为即时反馈;服务端会按魔术字节重新验一遍,前端校验从来
// 不算安全边界。
// 张数与单张大小不在前端设限 —— 服务端按 feedback.max_images / max_image_mb
// 决定,前端只在超限被拒时把结果说清楚。这样改配置不用同步改页面。
const FB_DROP_HINT="点击选择图片,或把截图拖进来 / 直接 Ctrl+V 粘贴";
let fbImgs=[];
function fbRenderShots(){
  const box=$("#fbshots");
  box.innerHTML=fbImgs.map((im,i)=>
    `<div style="position:relative;line-height:0">
       <img src="${im.url}" alt="" style="width:84px;height:60px;object-fit:cover;
         border:1px solid var(--line);border-radius:8px;display:block">
       <button data-i="${i}" class="fbdel" title="移除" style="position:absolute;top:-6px;right:-6px;
         width:20px;height:20px;border:none;border-radius:50%;background:var(--mal);color:#fff;
         font-size:13px;line-height:1;cursor:pointer">\u00d7</button>
     </div>`).join("");
  box.querySelectorAll(".fbdel").forEach(b=>b.onclick=()=>{fbImgs.splice(+b.dataset.i,1);fbRenderShots();});
  const tot=fbImgs.reduce((n,x)=>n+(x.size||0),0);
  $("#fbdrop").textContent=fbImgs.length
    ?("已选 "+fbImgs.length+" 张 · "+fmtSize(tot)+"(点这里继续添加)")
    :FB_DROP_HINT;
}
function fbAddFiles(files){
  const st=$("#fbstatus");
  for(const f of files){
    // 只挡类型:PNG/JPEG/GIF/WebP 之外服务端一律不收,先说比传完再说好。
    // 大小和张数不在这里挡 —— 上限由服务端配置决定,前端写死就会两边不一致。
    if(!/^image\/(png|jpeg|gif|webp)$/.test(f.type)){
      st.textContent="只支持 PNG / JPEG / GIF / WebP("+(f.name||"该文件")+" 不是)。";
      st.style.color="var(--mal)";continue;}
    const rd=new FileReader();
    rd.onload=()=>{fbImgs.push({url:rd.result,size:f.size});fbRenderShots();};
    rd.readAsDataURL(f);
  }
}
$("#fbdrop").onclick=()=>$("#fbfiles").click();
$("#fbfiles").onchange=e=>{fbAddFiles(e.target.files);e.target.value="";};
$("#fbdrop").addEventListener("dragover",e=>{e.preventDefault();$("#fbdrop").style.borderColor="var(--brand)";});
$("#fbdrop").addEventListener("dragleave",()=>{$("#fbdrop").style.borderColor="var(--line)";});
$("#fbdrop").addEventListener("drop",e=>{e.preventDefault();$("#fbdrop").style.borderColor="var(--line)";
  if(e.dataTransfer&&e.dataTransfer.files)fbAddFiles(e.dataTransfer.files);});
// 粘贴只在反馈弹窗开着时接管 —— 否则会把主页面往哈希框粘贴的行为也吃掉。
document.addEventListener("paste",e=>{
  if(!$("#fbmodal").classList.contains("open"))return;
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  const files=[];
  for(const it of items){if(it.kind==="file"){const f=it.getAsFile();if(f)files.push(f);}}
  if(files.length){e.preventDefault();fbAddFiles(files);}
});

$("#fbsend").onclick=async()=>{
  const msg=$("#fbmsg").value.trim();
  const st=$("#fbstatus");
  // 一张截图常比一段文字说得清,所以有图就不再强制写描述(服务端同一规则)。
  if(!msg&&!fbImgs.length){
    st.textContent="请填写问题描述,或附上截图。";st.style.color="var(--mal)";$("#fbmsg").focus();return;}
  const btn=$("#fbsend");btn.disabled=true;
  st.textContent="提交中…";st.style.color="var(--muted)";
  try{
    const r=await fetch("/feedback",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({kind:$("#fbkind").value,message:msg,
                           contact:$("#fbcontact").value.trim(),page:location.pathname,
                           images:fbImgs.map(x=>x.url)})});
    let d={};try{d=await r.json();}catch(e){d={ok:false,error:"服务端返回异常(HTTP "+r.status+")"};}
    if(!d.ok){
      // 429 是限流(每日条数或滑窗),413 是整个请求体超限(基本只可能是截图太大),
      // 和「内容不合法」都不是一回事,分开说清楚
      st.textContent=(r.status===429?"提交过于频繁,请稍后再试。":
                      r.status===413?"截图太大,请减少张数或压缩后再试。":
                      ("提交失败:"+(d.error||"未知错误")));
      st.style.color="var(--mal)";btn.disabled=false;return;
    }
    // 服务端按魔术字节复验,可能丢掉伪装成图片的文件 —— 丢了就必须说,否则用户
    // 以为截图传上去了,而管理员那边什么也看不到。
    st.textContent="已收到,感谢反馈(编号 #"+d.id+")。"
      +(d.images?(" 含 "+d.images+" 张截图。"):"")
      +(d.images_rejected?(" 有 "+d.images_rejected+" 张未被接受(格式不支持或过大)。"):"");
    st.style.color=d.images_rejected?"var(--mal)":"var(--clean)";
    $("#fbmsg").value="";$("#fbcontact").value="";$("#fbcount").textContent="0";
    fbImgs=[];fbRenderShots();
    toast("反馈已提交 #"+d.id);
    // 提交完直接切到「我的反馈」,让人立刻看见它进了列表、状态是待处理 ——
    // 否则弹窗一关,用户不知道这条到底有没有收到。
    loadMine().then(()=>fbSwitch("mine"));
    btn.disabled=false;
    refreshMetrics();
  }catch(e){
    st.textContent="提交失败:"+(e.message||"连接不上服务器");
    st.style.color="var(--mal)";btn.disabled=false;
  }
};

function drawReports(){
  /* Cards report the whole database (archStats) so they stop drifting every
     time the hourly harvester rotates rows out of the capped list. */
  const now=Date.now();
  const winTotal=allReports.length;
  const total=archStats?archStats.total:winTotal;
  const nMal=archStats?archStats.malicious:allReports.filter(x=>x.verdict==="malicious").length;
  const nSusp=archStats?archStats.suspicious:allReports.filter(x=>x.verdict==="suspicious").length;
  const nRecent=archStats?archStats.recent:allReports.filter(x=>{const t=Date.parse(x.stored_at||"");return t&&(now-t)<7*864e5;}).length;
  const hs=$("#hsub");if(hs)hs.textContent="\u5171 "+total+" \u6761\u5a01\u80c1\u8bb0\u5f55"+(winTotal<total?" \u00b7 \u5217\u8868\u663e\u793a\u6700\u8fd1 "+winTotal+" \u6761":"");
  const st=$("#hstats");if(st)st.innerHTML=
    `<div class="hstat"><div class="v">${total}</div><div class="k">威胁总数</div></div>
     <div class="hstat mal"><div class="v">${nMal}</div><div class="k">恶意</div></div>
     <div class="hstat susp"><div class="v">${nSusp}</div><div class="k">可疑</div></div>
     <div class="hstat"><div class="v">${nRecent}</div><div class="k">近 7 天新增</div></div>`;
  const fc={all:winTotal,malicious:allReports.filter(x=>x.verdict==="malicious").length,suspicious:allReports.filter(x=>x.verdict==="suspicious").length};
  document.querySelectorAll("#hfilters .hchip").forEach(c=>{const f=c.dataset.f;c.classList.toggle("on",f===hFilter);
    const b=c.querySelector("b");if(b)b.textContent=(fc[f]!=null?fc[f]:0);});
  const q=($("#rfilter").value||"").toLowerCase().trim();
  let l=allReports.slice();
  if(hFilter!=="all")l=l.filter(x=>x.verdict===hFilter);
  if(q)l=l.filter(x=>(x.name||"").toLowerCase().includes(q)||(x.sha256||"").includes(q)||(x.md5||"").includes(q)
    ||(x.threat_label||"").toLowerCase().includes(q)||(x.category||"").toLowerCase().includes(q)||catName(x.category).includes(q)||(VMAP[x.verdict]||"").includes(q));
  if(hSort==="detections")l.sort((a,b)=>(b.malicious-a.malicious)||(b.total_engines-a.total_engines));
  else if(hSort==="name")l.sort((a,b)=>(a.name||a.sha256||"").localeCompare(b.name||b.sha256||""));
  else l.sort((a,b)=>Date.parse(b.stored_at||"")-Date.parse(a.stored_at||""));
  const box=$("#reports");
  if(!l.length){box.innerHTML='<div class="empty" style="padding:50px 0;text-align:center">'+(total?"无匹配结果":"暂无威胁记录")+'</div>';return;}
  box.innerHTML=l.map(x=>{const v=x.verdict||"unknown";const t=x.total_engines||0,m=x.malicious||0;const pct=t?Math.round(m/t*100):0;
    const catTag=x.category?`<span class="pill susp" style="margin-right:5px">${esc(catName(x.category))}</span>`:"";
    const fam=(x.threat_label||x.category)?`<div class="hfam">${catTag}${x.threat_label?`<span class="pill ${v==='malicious'?'mal':'susp'}">${esc(x.threat_label)}</span>`:""}</div>`:"";
    return `<div class="hcard ${esc(v)}" data-id="${esc(x.sha256)}">
      <div class="hv"><span class="chip">${esc(VMAP[v]||v)}</span></div>
      <div class="hmain"><div class="hnm">${esc(x.name||x.sha256.slice(0,32))}</div>${fam}<div class="hmeta">${esc(x.sha256)}</div></div>
      <div class="hdet"><div class="hratio">${m}<small>/${t}</small></div>
        <div class="hbarwrap"><div class="hbarfill" style="width:${pct}%"></div></div>
        <div class="hdate">${esc((x.stored_at||"").replace("T"," ").slice(0,16))}</div></div>
    </div>`;}).join("");
  
}

    </div>`;}).join("")
    :'<div class="dempty" style="padding:50px 0;text-align:center">暂无正常样本。查询或拖入一个 VirusTotal 判为安全的文件后,会自动收录并显示在这里。</div>';
  $("#report").innerHTML=`<style>.hcard.clean{border-left-color:var(--clean)}.hcard.clean .hv .chip{background:var(--clean)}.hcard.clean .hnm{color:var(--ink)}.pill.clean{background:var(--cleanbg);color:var(--clean);border-color:transparent}.hstat.clean .v{color:var(--clean)}</style>
    <div class="sfpage">

      ${stat(total,"正常样本","clean")}${stat(nSigned,"已签名")}${stat(nBeh,"含沙箱行为")}${stat(cap||"—","留存上限")}
    </div>

  const rep=$("#report");

  rep.querySelectorAll(".sflist .hcard").forEach(el=>el.onclick=()=>{const id=el.dataset.id;if(id&&navigator.clipboard){navigator.clipboard.writeText(id);toast("已复制哈希");}});

        <div class="hmeta">${t?(m+" / "+t+" \u4e2a\u5f15\u64ce\u5224\u4e3a\u6076\u610f"):"\u672a\u63d0\u4f9b\u5f15\u64ce\u8ba1\u6570"}</div></div>

async function openStored(id){setStatus("加载已保存报告…","busy");
  try{const d=await jget("/vt/report/"+encodeURIComponent(id));if(!d.ok){setStatus(d.error||"未找到","err");return;}
    render(d.report,d.stored_at,true);setStatus("已保存报告 · "+(d.stored_at||""),"ok");}catch(e){setStatus("加载失败:"+e.message,"err");}}

async function lookupHash(h,r){return jpost("/vt/lookup",{hash:h,refresh:!!r});}
async function doLookup(){const h=$("#hash").value.trim().toLowerCase();
  if(!/^([0-9a-f]{32}|[0-9a-f]{40}|[0-9a-f]{64})$/.test(h)){setStatus("请输入合法的 MD5 / SHA-1 / SHA-256 哈希。","err");return;}
  $("#go").disabled=true;setStatus("正在查询 VirusTotal(含沙箱行为报告)…","busy");
  try{const d=await lookupHash(h,false);
    if(d.ok){render(d.report,d.stored_at,d.cached);setStatus((d.cached?"来自服务器缓存":"VT 实时查询")+(d.stored?" · 威胁报告已留存":" · 安全文件,已收录到正常样本"),"ok");loadReports();loadBenign();}
    else if(d.vt_unknown&&(d.sources_ok||0)>0){renderSecondaryOnly(h,d);
      setStatus("VirusTotal 无此文件记录 · 以下结论来自其他 "+d.sources_ok+" 个情报源","err");}
    else setStatus(d.error||"查询失败","err");}catch(e){setStatus("查询失败:"+e.message,"err");}finally{$("#go").disabled=false;}
}
async function sha256File(f){const b=await f.arrayBuffer();const d=await crypto.subtle.digest("SHA-256",b);return Array.from(new Uint8Array(d)).map(x=>x.toString(16).padStart(2,"0")).join("");}
async function onFile(f){if(!f)return;if(!crypto.subtle){setStatus("需要 HTTPS 才能本地算哈希。","err");return;}
  setStatus("计算 SHA-256:"+f.name+" ("+fmtSize(f.size)+")…","busy");
  try{const sha=await sha256File(f);$("#hash").value=sha;setStatus("SHA-256 "+sha.slice(0,20)+"… · 查询 VT 中…","busy");
    const d=await lookupHash(sha,false);
    if(d.ok){render(d.report,d.stored_at,d.cached);setStatus("已查到报告","ok");loadReports();}
    else{
      // 别的云已经有结论就先摆出来,再照旧给出上传提示 —— 两者不矛盾:
      // VT 确实没这个文件,样本还是该传给它分析。
      if(d.vt_unknown&&(d.sources_ok||0)>0)renderSecondaryOnly(sha,d);
      uploadPrompt(f,sha,d.error||"VT 未收录");}}catch(e){setStatus("处理文件失败:"+e.message,"err");}}
function uploadPrompt(f,sha,why){setStatus("VirusTotal 未收录此文件("+why+")","err");
  $("#report").innerHTML=`<div class="card"><div class="pane on" style="display:block">
    <div style="font-size:16px;font-weight:700;margin-bottom:8px">🆕 VT 未收录该文件</div>
    <div class="kv"><div class="k">文件</div><div class="v">${esc(f.name)} · ${fmtSize(f.size)}</div><div class="k">SHA-256</div><div class="v">${esc(sha)}</div></div>
    <p style="color:var(--muted);margin:14px 0">可将样本上传到 VirusTotal 分析(数分钟出结果,自动轮询)。<b style="color:var(--susp)">VT 会把样本共享给安全社区,勿传机密文件。</b></p>
    <button class="btn" id="upbtn" style="padding:12px 20px">⬆️ 上传样本到 VirusTotal 扫描</button></div></div>`;
  $("#upbtn").onclick=()=>uploadSample(f,sha);}
async function uploadSample(f,sha){if(f.size>MAXUP*1024*1024){setStatus("文件 "+fmtSize(f.size)+" 超过上传上限 "+MAXUP+"MB,无法送检(可用哈希查询)","err");return;}
  const b=$("#upbtn");if(b)b.disabled=true;setStatus("上传样本到 VirusTotal…("+fmtSize(f.size)+")","busy");
  try{const r=await fetch("/vt/upload?name="+encodeURIComponent(f.name),{method:"POST",body:f});const d=await r.json();
    if(!d.ok){setStatus("上传失败:"+(d.error||""),"err");if(b)b.disabled=false;return;}
    if(d.found){render(d.report,d.stored_at,d.cached);setStatus("VirusTotal 已有该文件报告","ok");loadReports();return;}
    setStatus("已提交分析,自动轮询中…","busy");poll(sha,0);}catch(e){setStatus("上传失败:"+e.message,"err");if(b)b.disabled=false;}}
function poll(sha,n){const MAX=24,MS=20000;if(n>=MAX){setStatus("分析仍在进行,已停止轮询,稍后用该哈希再查即可。","err");return;}
  setTimeout(async()=>{try{const d=await lookupHash(sha,true);
    if(d.ok){render(d.report,d.stored_at,d.cached);setStatus("VT 分析完成"+(d.stored?",威胁报告已留存":",安全文件不留存"),"ok");loadReports();}
    else{setStatus("VT 分析中…(第 "+(n+1)+" 次 · 约 "+((n+1)*MS/1000)+"s)","busy");poll(sha,n+1);}}catch(e){poll(sha,n+1);}},MS);}

// ---- 单文件送检 ----
// 这一页刻意【不做】批量。2026-08-13 去掉了多选批量，两个原因都不是界面偏好：
//   * VirusTotal 已经在成批拒绝本项目的采集节点（245 上每一把密钥都是 429，连刚添加的也是），额度是稀缺资源，
//     而一次批量能在几十秒里把它花完；
//   * 这一页在公网上没有口令门，任何人都能打开。批量意味着任何人都能一次提交几十个文件，
//     既烧掉额度，又把这些样本公开共享给安全社区 —— 送检是不可撤回的。
// 单个文件的整条路径（算哈希 → 查 VT → 未收录再问要不要上传）原样保留，见 onFile()。
function onFiles(files){const arr=Array.from(files||[]);if(!arr.length)return;
  // 多选或多拖时不静默丢掉其余文件，明确说一句只取了第一个——悄悄少做事比做不到更糟。
  // 用 toast 而不是 setStatus：下一行的 onFile() 立即就会把状态条改成「计算 SHA-256」。
  if(arr.length>1)toast("每次只分析一个文件，已取第一个："+arr[0].name+"（其余 "+(arr.length-1)+" 个未处理）");
  onFile(arr[0]);}

// ---- render ----
function asText(v){if(v==null)return"";if(typeof v==="string"||typeof v==="number")return String(v);
  if(v.hostname)return v.hostname+(v.resolved_ips?(" → "+[].concat(v.resolved_ips).join(", ")):"");
  if(v.destination_ip)return v.destination_ip+(v.destination_port?(":"+v.destination_port):"")+(v.transport_layer_protocol?(" "+v.transport_layer_protocol):"");
  if(v.url)return(v.request_method?v.request_method+" ":"")+v.url+(v.response_status_code?(" ["+v.response_status_code+"]"):"");
  if(v.path)return v.path+(v.sha256?("  ("+String(v.sha256).slice(0,16)+"…)"):"");
  if(v.key!==undefined)return v.key+(v.value!=null?(" = "+v.value):"");
  if(v.process_name)return(v.process_id?("["+v.process_id+"] "):"")+v.process_name;
  if(v.name)return v.name;return JSON.stringify(v);}
function box(t,a){a=a||[];if(!a.length)return"";const N=200,s=a.slice(0,N);
  return `<div class="bx"><h4>${esc(t)}<span class="n">${a.length}</span></h4><ul>${s.map(x=>`<li>${esc(asText(x))}</li>`).join("")}${a.length>N?`<li style="color:var(--dim)">… 其余 ${a.length-N} 项省略</li>`:""}</ul></div>`;}
function pills(a,c){a=a||[];return a.map(t=>`<span class="pill ${c||''}">${esc(asText(t))}</span>`).join("");}

function render(report,storedAt,cached){
  viewMode="report";
  const f=(report&&report.file)||{},b=(report&&report.behaviour)||{};
  const st=f.last_analysis_stats||{};const mal=st.malicious||0,susp=st.suspicious||0;
  const total=Object.values(st).reduce((a,c)=>a+(+c||0),0);const verdict=verdictOf(f);const pct=total?Math.round(mal/total*100):0;
  const names=f.names||[],ptc=f.popular_threat_classification||{},sig=f.signature_info||{},votes=f.total_votes||{};

    ["互斥体",b.mutexes_created],["服务创建",b.services_created],["加载模块",b.modules_loaded],["高危调用",b.calls_highlighted],["签名命中",b.signature_matches]];
  const behCount=groups.reduce((a,g)=>a+((g[1]||[]).length),0)+mitre.length;
  const hr=(l,v)=>v?`<div class="hrow" data-copy="${esc(v)}"><span>${l}</span>${esc(v)}</div>`:"";

  $("#report").innerHTML=`<div class="card v-${verdict}">

      <div class="ring" style="--pct:${pct}"><div class="n"><b>${mal}</b><small>/ ${total}</small></div></div>

    ${renderSources(report)}
    <div class="seg">

    <div class="pane" data-p="beh">${renderBeh(b,mitre,groups)}</div>
    <div class="pane" data-p="graph">${renderGraph(report,f,b)}</div>

    if(!(node&&sub))return;
    node.classList.add("g-collapsible");
    node.insertAdjacentHTML("afterbegin",'<span class="g-caret">▾</span>');

    node.addEventListener("click",e=>{if(e.target.closest(".ipq"))return;

      if(ct){clearTimeout(ct);ct=null;}e.preventDefault();

function gBase(p){p=String(p==null?"":p);const i=Math.max(p.lastIndexOf("\\"),p.lastIndexOf("/"));return i>=0?p.slice(i+1):p;}
function gShort(h){h=String(h==null?"":h);return h.length>20?h.slice(0,20)+"…":h;}
function gLeaf(x){
  if(x==null)return {t:"(空)",s:""};
  if(typeof x==="string"||typeof x==="number"){const s=String(x);const bn=gBase(s);return {t:bn||s,s:(bn&&bn!==s)?s:""};}
  if(x.hostname)return {t:x.hostname,s:[].concat(x.resolved_ips||[]).join(", ")};
  if(x.destination_ip)return {t:x.destination_ip+(x.destination_port?(":"+x.destination_port):""),s:x.transport_layer_protocol||""};
  if(x.url)return {t:(x.request_method?x.request_method+" ":"")+x.url,s:x.response_status_code?("HTTP "+x.response_status_code):""};
  if(x.path)return {t:gBase(x.path)||x.path,s:x.sha256?("SHA256 "+gShort(x.sha256)):String(x.path)};
  if(x.key!==undefined)return {t:String(x.key),s:(x.value!=null?String(x.value):"")};
  if(x.process_name||x.name)return {t:String(x.name||x.process_name),s:x.process_id?("PID "+x.process_id):""};

/* Degraded-mode banner: when VirusTotal is unavailable the backend answers from
   the other feeds and marks the report degraded. Wrap render() so every entry
   point (hash lookup, dropped file, stored report) shows why the VT panel is empty.
   Text uses \u escapes so the file stays pure ASCII. */
(function(){
  if (typeof render !== "function") return;
  var orig = render;
  window.render = function(report, storedAt, cached){
    var out = orig.apply(this, arguments);
    try{
      var host = document.getElementById("report");
      if (report && report.degraded && host && !host.querySelector(".degbanner")){
        var ok = (report.sources || []).filter(function(x){ return x.querySucceeded; })
                                       .map(function(x){ return x.source; });
        var div = document.createElement("div");
        div.className = "degbanner";
        div.style.cssText = "display:flex;gap:9px;align-items:flex-start;"
          + "margin:0 0 12px;padding:9px 13px;border-radius:10px;font-size:12.5px;"
          + "line-height:1.55;background:rgba(251,191,36,.13);"
          + "border:1px solid rgba(217,119,6,.30);color:#8a5a00";
        var reason = report.degraded_reason || "unavailable";
        div.textContent = "\u26a0 VirusTotal \u6682\u4e0d\u53ef\u7528\uff1a" + reason
          + " \u2014 \u4ee5\u4e0b\u7ed3\u8bba\u6765\u81ea\u5176\u4ed6\u60c5\u62a5\u6e90"
          + (ok.length ? "\uff1a" + ok.join(", ") : "");
        host.insertBefore(div, host.firstChild);
      }

  };
})();

<script>
/* Motion layer: hooks every user action (query, upload, tabs, history,
   status changes) without touching the existing markup or handlers.
   A few entries below still name the old batch controls (#bsubmit, #bretry,
   [data-sub], btbody). They are inert -- the batch list was removed on 2026-08-13,
   so those selectors simply never match. Left in place rather than surgically
   pruned: this is a lookup table, and editing it risks the effects that DO fire.
   Animation classes are removed on animationend so :hover transforms keep
   working (an animation with fill-mode:both would otherwise pin transform). */
(function(){
  var D = document;
  var RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  function stagger(nodes, cls, step, cap){
    if (RM || !nodes) return;
    step = step || 45; cap = (cap == null ? 12 : cap);
    /* Animate only the first cap+1 nodes. Past the cap every node received the
       SAME delay (Math.min(i,cap)*step), so animating hundreds of rows looked
       identical to animating a dozen while costing far more. And the old loop
       read n.offsetWidth per node, forcing a synchronous layout each iteration:
       with a 300-row archive that was ~300 full reflows per redraw and the main
       source of the stall. Now class writes (which do not force layout) happen
       first, then ONE reflow for the whole batch, then the small visible set is
       animated. */
    var pick = [];

      var n = nodes[k];
      if (!n || n.nodeType !== 1) continue;
      if (n.tagName === "SCRIPT" || n.tagName === "STYLE") continue;
      n.classList.remove(cls);
      if (pick.length <= cap) pick.push(n);
    }
    if (!pick.length) return;
    void (pick[0].parentNode || pick[0]).offsetWidth;
    pick.forEach(function(n, idx){
      n.style.animationDelay = (idx * step) + "ms";
      n.classList.add(cls);
      n.addEventListener("animationend", function(){
        n.classList.remove(cls);
        n.style.animationDelay = "";
      }, {once: true});
    });
  }

  /* 1. status line reacts to every action outcome */
  if (typeof setStatus === "function"){
    var origStatus = setStatus;
    window.setStatus = function(m, k){
      var out = origStatus.apply(this, arguments);
      if (!RM){
        var el = D.getElementById("status");
        if (el){
          el.classList.remove("bwa-st","bwa-err","bwa-ok","bwa-busy");
          void el.offsetWidth;
          el.classList.add("bwa-st");
          if (k === "err") el.classList.add("bwa-err");
          else if (k === "ok") el.classList.add("bwa-ok");
          else if (k === "busy") el.classList.add("bwa-busy");
        }
      }
      return out;
    };
  }

  /* 2. any rendered result animates in, whatever triggered it */
  function observe(id, cls, deep, step){
    var host = D.getElementById(id);
    if (!host) return;
    new MutationObserver(function(muts){
      if (RM) return;
      var added = false;
      for (var i = 0; i < muts.length; i++){
        if (muts[i].addedNodes && muts[i].addedNodes.length){ added = true; break; }
      }
      if (!added) return;
      stagger(host.children, cls, step, 12);
      if (deep) stagger(host.querySelectorAll(".dsec,.hcard,.kv"), "bwa-anim", 35, 16);
    }).observe(host, {childList: true});
  }
  observe("report",  "bwa-anim", true, 45);
  observe("reports", "bwa-row",  false, 22);
  observe("btbody",  "bwa-row",  false, 18);
  observe("metrics", "bwa-pop",  false, 50);

  /* 3. click ripple + press feedback on every control */
  D.addEventListener("pointerdown", function(e){
    if (RM || !e.target || !e.target.closest) return;
    var t = e.target.closest(".btn,.fbtn,.seg .s,.hchip,.hcard");
    if (!t) return;
    var box = t.getBoundingClientRect();
    var s = D.createElement("span");
    s.className = "bwa-rip";
    s.style.left = (e.clientX - box.left) + "px";
    s.style.top  = (e.clientY - box.top) + "px";
    t.appendChild(s);
    setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 620);
  }, true);

  /* 4. drag & drop feedback */
  var drop = D.getElementById("drop");
  if (drop && !RM){
    ["dragenter","dragover"].forEach(function(ev){
      drop.addEventListener(ev, function(){ drop.classList.add("bwa-drag"); });
    });
    ["dragleave","dragend","drop"].forEach(function(ev){
      drop.addEventListener(ev, function(){ drop.classList.remove("bwa-drag"); });
    });
    drop.addEventListener("drop", function(){
      drop.classList.remove("bwa-drop"); void drop.offsetWidth; drop.classList.add("bwa-drop");
    });
  }

  /* 5. toast bounce */
  var toast = D.getElementById("toast");
  if (toast && !RM){
    new MutationObserver(function(){
      toast.classList.remove("bwa-t"); void toast.offsetWidth; toast.classList.add("bwa-t");
    }).observe(toast, {childList: true, characterData: true, subtree: true});
  }

  /* 6. first paint */
  if (!RM) stagger(D.querySelectorAll(".card"), "bwa-anim", 60, 8);
})();
</script>

<style>
/* ---- per-feature click effects (appended; no rule above is modified) --------
   The motion layer added earlier gives every control the SAME white ripple, so
   pressing "analyse", opening the fox-intel page and submitting feedback all
   looked identical. This block gives each feature its own signature: a colour
   for the ripple that already exists, plus one short effect that matches what
   the action actually does -- a scan beam for analysis, embers for the fox page,
   a drawer pulling open for the archive, radar pings for the client list.

   It re-uses the existing ripple instead of adding a second one. The earlier
   layer creates .bwa-rip on pointerdown and hard-codes its colour; re-declaring
   that colour as a custom property here (same selectors, later in the document,
   so it wins on order) lets each feature tint it without a second element and
   without touching that code.

   Everything else is drawn in ONE fixed, pointer-events:none overlay. Effects
   therefore cannot shift layout, cannot swallow a click, and never need the
   clicked element to be position:relative -- which matters because most of
   these controls (.navi, .hrow, .dfam-i, .g-btn) are not.

   All of it is inert under prefers-reduced-motion. */

/* 1. tint the ripple that already exists, per feature */
.bwa-rip{background:var(--bwx-rip,rgba(255,255,255,.45))}
.hcard .bwa-rip,.seg .s .bwa-rip,.hchip .bwa-rip{background:var(--bwx-rip,rgba(99,102,241,.28))}
/* The earlier layer only ripples .btn/.fbtn/.seg .s/.hchip/.hcard, so a tint on
   anything else was dead CSS until the JS below started emitting a ripple for
   these three shapes too. They need to clip it: .navi/.iconbtn become positioned
   so an absolute child anchors to them, while .fbdel is already absolutely
   positioned (top:-6px;right:-6px) and must NOT be re-positioned or it moves. */
.navi,.iconbtn{position:relative;overflow:hidden}
.fbdel{overflow:hidden}
#sfbtn{--bwx-rip:rgba(249,115,22,.34)}
#histbtn{--bwx-rip:rgba(107,118,136,.30)}
#fbbtn{--bwx-rip:rgba(13,148,136,.30)}
a.navi[href="/engine"]{--bwx-rip:rgba(139,92,246,.30)}
a.navi[href="/online"]{--bwx-rip:rgba(15,157,88,.30)}
/* 与 #fbbtn 同一个青色:反馈和客服是同一类「找人说话」的入口,涟漪颜色跟着语义走
   而不是各挑一个。缺这一行不会报错,只会静默回落到默认色,是那种没人会去查的差异。 */
a.navi[href="/support"]{--bwx-rip:rgba(13,148,136,.30)}
a.navi[href="/api/docs"]{--bwx-rip:rgba(107,118,136,.26)}
#fbsend{--bwx-rip:rgba(255,255,255,.5)}
#bretry,[data-retry]{--bwx-rip:rgba(224,134,0,.32)}
.fbdel{--bwx-rip:rgba(255,255,255,.55)}
.seg .s[data-t="det"]{--bwx-rip:rgba(229,72,77,.26)}
.seg .s[data-t="beh"]{--bwx-rip:rgba(224,134,0,.26)}
.seg .s[data-t="graph"]{--bwx-rip:rgba(139,92,246,.26)}
.seg .s[data-t="meta"]{--bwx-rip:rgba(107,118,136,.26)}
.hchip[data-f="malicious"]{--bwx-rip:rgba(229,72,77,.26)}
.hchip[data-f="suspicious"]{--bwx-rip:rgba(224,134,0,.26)}
.hcard.malicious{--bwx-rip:rgba(229,72,77,.22)}
.hcard.suspicious{--bwx-rip:rgba(224,134,0,.22)}

/* 2. press feedback for the controls the earlier layer does not cover.
      That layer only reached .btn/.fbtn/.seg .s/.hchip/.hcard, which left the
      whole nav bar, the hash rows and the graph toolbar with no reaction at all.

      The transition is re-declared per group rather than as one shared rule:
      .navi and .iconbtn already animate border-color/color/box-shadow, and a
      blanket `transition:transform` here would win on source order and silently
      turn their hover colour change into a jump. */
.navi{transition:border-color .15s,color .15s,box-shadow .15s,transform .11s ease}
.iconbtn{transition:border-color .15s,color .15s,transform .11s ease}
.g-btn,.dfam-i,.hrow,.fbtab,.dmore,.hhead .x,.brand{transition:transform .11s ease}
.navi:active,.iconbtn:active,.g-btn:active,.dfam-i:active,.hrow:active,
.fbtab:active,.dmore:active,.hhead .x:active,#fbdrop:active,.brand:active{
  transform:translateY(1px) scale(.99)}

/* 3. the overlay. z-index 58 clears the modals (40) and the download link (50)
      while staying under the toast (60), so a toast is never hidden by sparks.
      contain is layout+paint only: `strict` would add size containment, which
      this element does not want to reason about. overflow:hidden keeps an effect
      near the viewport edge from ever producing a scrollbar. */
#bwxfx{position:fixed;inset:0;z-index:58;pointer-events:none;overflow:hidden;
  contain:layout paint}
#bwxfx>*{position:absolute}

@keyframes bwx-ring{from{transform:scale(.2);opacity:.85}to{transform:scale(1);opacity:0}}
@keyframes bwx-ringin{from{transform:scale(1);opacity:.75}to{transform:scale(.2);opacity:0}}
@keyframes bwx-part{from{transform:translate(0,0) scale(1);opacity:.95}
                    to{transform:translate(var(--dx,0),var(--dy,0)) scale(.25);opacity:0}}
@keyframes bwx-in{from{transform:translate(var(--dx,0),var(--dy,0)) scale(.5);opacity:0}
                  55%{opacity:.95}
                  to{transform:translate(0,0) scale(.4);opacity:0}}
@keyframes bwx-beam{from{left:-42%}to{left:104%}}
@keyframes bwx-shelf{0%{transform:scaleX(0);opacity:.9}70%{transform:scaleX(1);opacity:.75}100%{transform:scaleX(1);opacity:0}}
@keyframes bwx-glyph{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
                     28%{opacity:1}
                     100%{opacity:0;transform:translate(calc(-50% + var(--gx,0px)),calc(-50% + var(--gy,-26px))) scale(1.15)}}
@keyframes bwx-spin{from{transform:rotate(0);opacity:.9}to{transform:rotate(540deg);opacity:0}}
@keyframes bwx-unfold{0%{transform:scaleY(0);opacity:.85}100%{transform:scaleY(1);opacity:0}}

.bwx-ring{border-radius:50%;border:2px solid var(--bwx-c);animation:bwx-ring .6s cubic-bezier(.2,.7,.3,1) forwards}
.bwx-ring.in{animation-name:bwx-ringin}
.bwx-part{border-radius:50%;background:var(--bwx-c);animation:bwx-part .62s cubic-bezier(.2,.6,.3,1) forwards}
.bwx-part.slow{animation-duration:.95s;animation-timing-function:ease-out}
.bwx-part.hollow{background:transparent;border:1.5px solid var(--bwx-c)}
.bwx-part.inward{animation-name:bwx-in;animation-duration:.5s}
.bwx-beam{border-radius:12px;overflow:hidden}
.bwx-beam i{position:absolute;top:0;bottom:0;width:36%;
  background:linear-gradient(90deg,transparent,var(--bwx-c),transparent);
  animation:bwx-beam .6s ease-in-out forwards}
.bwx-shelf{height:2px;border-radius:2px;background:var(--bwx-c);transform-origin:0 50%;
  animation:bwx-shelf .5s ease-out forwards}
.bwx-glyph{transform:translate(-50%,-50%);color:var(--bwx-c);font:700 15px var(--mono);
  white-space:nowrap;animation:bwx-glyph .72s ease-out forwards}
.bwx-spin{border-radius:50%;border:2px solid transparent;border-top-color:var(--bwx-c);
  border-right-color:var(--bwx-c);animation:bwx-spin .6s linear forwards}
.bwx-unfold{width:2px;border-radius:2px;background:var(--bwx-c);transform-origin:50% 0;
  animation:bwx-unfold .45s ease-out forwards}

/* the archive card lifts as it hands off to the report view */
@keyframes bwx-lift{0%{transform:none}100%{transform:translateY(-6px) scale(1.01);opacity:.75}}
.hcard.bwx-lift{animation:bwx-lift .28s ease forwards}

@media (prefers-reduced-motion: reduce){
  #bwxfx{display:none}
  .navi:active,.iconbtn:active,.g-btn:active,.dfam-i:active,.hrow:active,
  .fbtab:active,.dmore:active,.hhead .x:active,#fbdrop:active,.brand:active{transform:none}
  .hcard.bwx-lift{animation:none}
}
</style>
<script>
/* Per-feature click effects. One delegated listener, one overlay, a registry
   that maps a control to the effect that matches its meaning.

   Delegation is not a style preference here: .hcard, .seg .s, .fbtn, [data-sub]
   and friends are re-created every time innerHTML is rewritten, so anything
   bound per element would silently stop firing after the first render.

   The listener is capture-phase and passive, never calls preventDefault or
   stopPropagation, and returns before doing any work when the press is not a
   primary button. It can therefore never change what a control does. */
(function(){
  var D = document;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var BRAND="99,102,241", PURPLE="139,92,246", MAL="229,72,77", SUSP="224,134,0",
      CLEAN="15,157,88", FOX="249,115,22", TEAL="13,148,136", SLATE="107,118,136";

  var layer=null;
  function fx(){
    if (!layer || !layer.parentNode){
      layer = D.getElementById("bwxfx");
      if (!layer){ layer = D.createElement("div"); layer.id = "bwxfx"; D.body.appendChild(layer); }
    }
    return layer;
  }
  /* Rapid clicking must not be able to pile up unbounded DOM. Effects are all
     sub-second, so a live count this high only happens under a stuck finger. */
  function busy(){ return fx().childNodes.length > 64; }

  function add(cls, css, life){
    var d = D.createElement("div");
    d.className = cls;
    d.style.cssText = css;
    fx().appendChild(d);
    setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, life || 800);
    return d;
  }
  function box(el){ return el.getBoundingClientRect(); }
  function mid(el){ var b = box(el); return [b.left + b.width/2, b.top + b.height/2]; }

  /* ---- primitives ------------------------------------------------------- */

  function ring(x, y, c, size, delay, inward){
    var s = size || 64;
    add("bwx-ring" + (inward ? " in" : ""),
        "left:" + x + "px;top:" + y + "px;width:" + s + "px;height:" + s + "px;" +
        "margin:" + (-s/2) + "px 0 0 " + (-s/2) + "px;--bwx-c:rgba(" + c + ",.55);" +
        (delay ? "animation-delay:" + delay + "ms" : ""), 700 + (delay || 0));
  }
  function radar(x, y, c, n){ for (var i = 0; i < (n || 3); i++) ring(x, y, c, 22 + i*10, i*150); }

  function part(x, y, c, dx, dy, extra, life){
    var sz = 6;
    add("bwx-part" + (extra ? " " + extra : ""),
        "left:" + x + "px;top:" + y + "px;width:" + sz + "px;height:" + sz + "px;" +
        "margin:" + (-sz/2) + "px 0 0 " + (-sz/2) + "px;--bwx-c:rgba(" + c + ",.9);" +
        "--dx:" + dx + "px;--dy:" + dy + "px", life || 700);
  }
  function burst(x, y, c, n, dist){
    n = n || 8;
    for (var i = 0; i < n; i++){
      var a = (Math.PI*2/n)*i - Math.PI/2;
      var r = dist || 30;
      part(x, y, c, Math.cos(a)*r, Math.sin(a)*r);
    }
  }
  /* embers / bubbles: same rise, different silhouette. Warm solid dots read as
     sparks; hollow rings read as bubbles. */
  function rise(x, y, c, n, hollow){
    for (var i = 0; i < (n || 7); i++){
      part(x + (Math.random()*22 - 11), y,
           c, (Math.random()*18 - 9), -(26 + Math.random()*28),
           "slow" + (hollow ? " hollow" : ""), 1000);
    }
  }
  function suck(el, c){
    var b = box(el), n = 8;
    for (var i = 0; i < n; i++){
      var a = (Math.PI*2/n)*i;
      var rx = Math.cos(a) * (b.width/2 - 6), ry = Math.sin(a) * (b.height/2 - 6);
      part(b.left + b.width/2 + rx, b.top + b.height/2 + ry, c, -rx*0.9, -ry*0.9, "inward", 600);
    }
  }
  function beam(el, c){
    if (!el) return;
    var b = box(el);
    var d = add("bwx-beam",
      "left:" + b.left + "px;top:" + b.top + "px;width:" + b.width + "px;height:" + b.height +
      "px;--bwx-c:rgba(" + c + ",.5)", 700);
    d.appendChild(D.createElement("i"));
  }
  function glyph(x, y, txt, c, gx, gy){
    var d = add("bwx-glyph",
      "left:" + x + "px;top:" + y + "px;--bwx-c:rgba(" + c + ",.95);" +
      "--gx:" + (gx || 0) + "px;--gy:" + (gy == null ? -26 : gy) + "px", 800);
    d.textContent = txt;
  }
  function shelves(el, c){
    var b = box(el);
    for (var i = 0; i < 3; i++){
      add("bwx-shelf",
        "left:" + b.left + "px;top:" + (b.top + b.height*(0.3 + i*0.2)) + "px;" +
        "width:" + (b.width*1.5) + "px;--bwx-c:rgba(" + c + ",.6);" +
        "animation-delay:" + (i*70) + "ms", 700 + i*70);
    }
  }
  function spin(x, y, c){
    var s = 26;
    add("bwx-spin", "left:" + x + "px;top:" + y + "px;width:" + s + "px;height:" + s + "px;" +
        "margin:" + (-s/2) + "px 0 0 " + (-s/2) + "px;--bwx-c:rgba(" + c + ",.85)", 700);
  }
  function unfold(el, c){
    var b = box(el);
    add("bwx-unfold", "left:" + (b.left + b.width/2) + "px;top:" + b.bottom + "px;" +
        "height:" + Math.min(46, b.height*3) + "px;--bwx-c:rgba(" + c + ",.6)", 550);
  }

  /* ---- composed, per-feature effects ------------------------------------ */

  function analyse(el, x, y){            /* scanning a hash: a beam sweeps the row */
    beam(D.querySelector(".scan"), BRAND);
    ring(x, y, BRAND, 76);
  }
  function launch(x, y, c){              /* anything that uploads a sample */
    glyph(x, y, "\u2191", c, 0, -30);
    for (var i = 0; i < 5; i++) part(x + (i-2)*7, y, c, (i-2)*5, -(22 + Math.random()*16), "slow", 900);
  }
  function copied(el, x, y){             /* hash row -> clipboard */
    beam(el, CLEAN);
    glyph(x, y, "\u2713", CLEAN, 0, -22);
  }
  function tab(el){                      /* the four report tabs, one look each */
    var t = el.dataset.t, m = mid(el);
    if (t === "det")        { burst(m[0], m[1], MAL, 6, 26); ring(m[0], m[1], MAL, 52); }
    else if (t === "beh")   { radar(m[0], m[1], SUSP, 3); }
    else if (t === "graph") { burst(m[0], m[1], PURPLE, 7, 34); }
    else                    { unfold(el, SLATE); ring(m[0], m[1], SLATE, 46); }
  }
  function chip(el){                      /* archive verdict filters */
    var f = el.dataset.f, m = mid(el);
    ring(m[0], m[1], f === "malicious" ? MAL : f === "suspicious" ? SUSP : SLATE, 54);
  }
  function cardOpen(el, x, y){            /* threat card hands off to the report */
    var c = el.classList.contains("malicious") ? MAL
          : el.classList.contains("suspicious") ? SUSP : BRAND;
    ring(x, y, c, 70);
    el.classList.remove("bwx-lift");
    void el.offsetWidth;
    el.classList.add("bwx-lift");
    setTimeout(function(){ el.classList.remove("bwx-lift"); }, 340);
  }
  function graphBtn(el, x, y){            /* toolbar: outward, inward, or scale */
    var a = el.dataset.gact;
    if (a === "expand")        burst(x, y, BRAND, 8, 32);
    else if (a === "collapse") { for (var i = 0; i < 8; i++){
                                   var an = (Math.PI*2/8)*i, r = 30;
                                   part(x + Math.cos(an)*r, y + Math.sin(an)*r, BRAND,
                                        -Math.cos(an)*r, -Math.sin(an)*r, "inward", 600); } }
    else if (a === "zoomin")   ring(x, y, BRAND, 54);
    else if (a === "zoomout")  ring(x, y, BRAND, 54, 0, true);
    else                       { ring(x, y, SLATE, 40); glyph(x, y, "100%", SLATE, 0, -22); }
  }

  /* ---- registry. First match wins, so specific ids precede shared classes.
         .fbtn is last on purpose: it is the fallback shape shared by the batch
         row buttons and the detection filter, both of which want their own
         effect above. */
  var REG = [
    ["#go",                  function(el,x,y){ analyse(el,x,y); }],
    ["#drop",                function(el){ suck(el, BRAND); }],
    ["#upbtn",               function(el,x,y){ launch(x,y,BRAND); }],

    ["#sfbtn",               function(el,x,y){ rise(x,y,FOX,9); ring(x,y,FOX,60); }],
    ["#histbtn",             function(el){ shelves(el, SLATE); }],
    ["#fbbtn",               function(el,x,y){ rise(x,y,TEAL,6,true); }],
    ["#bwAboutLink",         function(el,x,y){ glyph(x,y,"\u2193",BRAND,0,30);
                                               part(x,y,BRAND,0,26,"slow",800); }],
    ['a[href="/engine"]',    function(el,x,y){ radar(x,y,PURPLE,3); }],
    ['a[href="/online"]',    function(el,x,y){ radar(x,y,CLEAN,4); }],
    ['a[href="/api/docs"]',  function(el,x,y){ glyph(x,y,"{ }",SLATE); }],
    [".brand",               function(el){ var l = el.querySelector(".logo") || el, m = mid(l);
                                           ring(m[0],m[1],BRAND,58); ring(m[0],m[1],PURPLE,58,120); }],

    [".seg .s",              function(el){ tab(el); }],
    [".hrow",                function(el,x,y){ copied(el,x,y); }],
    [".g-btn",               function(el,x,y){ graphBtn(el,x,y); }],
    [".ipq",                 function(el,x,y){ radar(x,y,BRAND,2); }],

    [".hchip",               function(el){ chip(el); }],
    [".hcard",               function(el,x,y){ cardOpen(el,x,y); }],
    [".hhead .x",            function(el,x,y){ ring(x,y,SLATE,46,0,true); }],

    ["#dallthreats",         function(el,x,y){ glyph(x,y,"\u2192",BRAND,26,0); }],
    [".dfam-i",              function(el,x,y){ glyph(x,y,"\u2192",MAL,24,0); }],

    ["#bsubmit",             function(el,x,y){ launch(x,y,BRAND); }],
    ["[data-sub]",           function(el,x,y){ launch(x,y,BRAND); }],
    ["#bretry",              function(el,x,y){ spin(x,y,SUSP); }],
    ["[data-retry]",         function(el,x,y){ spin(x,y,SUSP); }],
    ["[data-open]",          function(el){ unfold(el, BRAND); }],

    ["#fbsend",              function(el,x,y){ glyph(x,y,"\u27a4",TEAL,22,-18);
                                               burst(x,y,TEAL,5,22); }],
    ["#fbdrop",              function(el){ suck(el, BRAND); }],
    [".fbdel",               function(el,x,y){ burst(x,y,MAL,7,20); }],
    [".fbtab",               function(el){ var b = box(el);
                                           add("bwx-shelf","left:" + b.left + "px;top:" +
                                               (b.bottom - 2) + "px;width:" + b.width +
                                               "px;--bwx-c:rgba(" + BRAND + ",.85)", 600); }],

    [".fbtn",                function(el,x,y){ ring(x,y,BRAND,44); }]
  ];

  /* Controls the earlier layer already ripples. Anything here must NOT get a
     second one; anything in RIPPLE_MINE gets ours so its tint is not dead CSS. */
  var RIPPLE_THEIRS = ".btn,.fbtn,.seg .s,.hchip,.hcard";
  var RIPPLE_MINE   = ".navi,.iconbtn,.fbdel";
  function ripple(el, x, y){
    if (!el.matches) return;
    if (el.matches(RIPPLE_THEIRS) || !el.matches(RIPPLE_MINE)) return;
    var b = el.getBoundingClientRect();
    var s = D.createElement("span");
    s.className = "bwa-rip";                   /* reuse their class and keyframes */
    s.style.left = (x - b.left) + "px";
    s.style.top  = (y - b.top) + "px";
    el.appendChild(s);
    setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 620);
  }

  D.addEventListener("pointerdown", function(e){
    if (e.button !== 0 || e.isPrimary === false) return;
    var t = e.target;
    if (!t || !t.closest) return;
    for (var i = 0; i < REG.length; i++){
      var el = t.closest(REG[i][0]);
      if (!el) continue;
      if (el.disabled) return;                 /* a disabled control did nothing */
      if (busy()) return;
      try { REG[i][1](el, e.clientX, e.clientY); } catch (err) {}
      try { ripple(el, e.clientX, e.clientY); } catch (err) {}
      return;
    }
  }, true);
})();
</script>
</body>
</html>
