# Drop-in for bulwark-harvest.service on the collector node.
# Install to: /etc/systemd/system/bulwark-harvest.service.d/timeout.conf
#
# Why this exists
# ---------------
# The harvester paces every VirusTotal call (lookups AND uploads) at
# harvest.queries_per_minute, currently 3/min. The three run-length numbers have to
# stay ordered:
#
#     max_run_seconds (script)  <  TimeoutStartSec (systemd)  <  timer interval
#          1500 s / 25 min           2400 s / 40 min              3600 s / hourly
#
# The stock unit shipped TimeoutStartSec=30min against max_run_seconds=3000 (50 min),
# which is unreachable: systemd would SIGTERM the run at 30 min, and a unit killed on
# timeout is marked failed. `OnSuccess=bulwark-sync.service` does not fire for a
# failed unit, so the batch would never be pushed to the master server -- the
# harvester would look like it was working while nothing was aggregated.
#
# Keeping systemd's timeout strictly above the script's own deadline makes systemd a
# backstop only: the run always ends on its own terms, exits 0, and sync fires.
# Keeping both below the timer interval means runs can never overlap, which matters
# because the rate limiter is per-process -- two concurrent runs would put 6/min on
# VirusTotal. harvest.py also takes an flock as a second line of defence for
# manually launched runs, which systemd's own instance guard does not cover.

[Service]
TimeoutStartSec=2400
